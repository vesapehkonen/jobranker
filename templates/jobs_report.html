<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Job Ranking Report</title>
    <link rel="icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/jobs-report.css">
</head>
<body>
    <div class="page-header">
        <div>
            <h1>Job Ranking Report</h1>
            <div id="total-jobs" class="summary">Total jobs: {{ total_jobs }}</div>
        </div>
    </div>

    <div class="report-controls">
        <input id="job-search" type="search" placeholder="Search title, company, skills, requirements, or notes">
        <select id="score-filter" aria-label="Minimum score">
            <option value="">Any score</option>
            <option value="50">Score ≥ 50</option>
            <option value="65">Score ≥ 65</option>
            <option value="80">Score ≥ 80</option>
        </select>
        <select id="sort-order" aria-label="Sort jobs">
            <option value="newest">Newest</option>
            <option value="updated">Recently updated</option>
            <option value="score_desc">Highest score</option>
            <option value="score_asc">Lowest score</option>
            <option value="company">Company</option>
            <option value="title">Title</option>
            <option value="oldest">Oldest</option>
        </select>
        <select id="page-size" aria-label="Jobs per page">
            <option value="25">25 per page</option>
            <option value="50">50 per page</option>
            <option value="100">100 per page</option>
        </select>
    </div>

    <div class="filters">
        <button class="filter-button" data-filter="new" onclick="filterStatus('new')">New</button>
        <button class="filter-button" data-filter="interested" onclick="filterStatus('interested')">Interested</button>
        <button class="filter-button" data-filter="applied" onclick="filterStatus('applied')">Applied</button>
        <button class="filter-button" data-filter="recruiter_contact" onclick="filterStatus('recruiter_contact')">Recruiter</button>
        <button class="filter-button" data-filter="interview" onclick="filterStatus('interview')">Interview</button>
        <button class="filter-button" data-filter="skipped" onclick="filterStatus('skipped')">Skipped</button>
        <button class="filter-button" data-filter="rejected" onclick="filterStatus('rejected')">Rejected</button>
        <button class="filter-button" data-filter="archived" onclick="filterStatus('archived')">Archived</button>
        <button class="filter-button" data-filter="all" onclick="filterStatus('all')">All</button>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Score</th>
                    <th>Resume</th>
                    <th>Status</th>
                    <th>Job</th>
                    <th>Main Skill</th>
                    <th>Location</th>
                    <th>Processing</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="jobs-body"></tbody>
        </table>
    </div>
    <div class="pagination">
        <div id="results-summary" class="summary"></div>
        <div>
            <button id="previous-page" type="button">Previous</button>
            <span id="page-summary" class="summary"></span>
            <button id="next-page" type="button">Next</button>
        </div>
    </div>

    <script id="report-config" type="application/json">{{ {"apiToken": api_token, "reportVersion": report_version or ""} | tojson }}</script>
    <script src="/static/jobs-report.js" defer></script>
</body>
</html>
